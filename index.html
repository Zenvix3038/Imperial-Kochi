<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperial Kochi - Booking</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #003366; --accent: #f39c12; }
        body { font-family: 'Poppins', sans-serif; background: #f4f7f6; margin: 0; padding: 10px; }
        .card { max-width: 500px; margin: auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; }
        .form-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #e67e22; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h2>🚗 Imperial Kochi</h2>
        <p>Book Your Professional Driver</p>
    </div>
    <div class="form-body">
        <form id="bookingForm">
            <div class="form-group">
                <label>Customer Name (പേര്)</label>
                <input type="text" name="name" required>
            </div>
            <div class="form-group">
                <label>Mobile Number (മൊബൈൽ)</label>
                <input type="tel" name="phone" required>
            </div>
            <div class="form-group">
                <label>Booking Date (തിയതി)</label>
                <input type="date" name="bookingDate" required>
            </div>
            <div class="form-group">
                <label>Booking Time (സമയം)</label>
                <input type="time" name="bookingTime" required>
            </div>
            <div class="form-group">
                <label>Select Package (പാക്കേജ്)</label>
                <select name="package" required>
                    <option value="4h - Mini">4h (Mini) - ₹400</option>
                    <option value="8h - Full Day">8h (Full) - ₹750</option>
                    <option value="12h - Long Day">12h (Long) - ₹1100</option>
                    <option value="24h - Per Day">24h (Per Day) - ₹1400</option>
                </select>
            </div>
            <div class="form-group">
                <label>Notes/Location (മറ്റ് വിവരങ്ങൾ)</label>
                <textarea name="message" rows="2"></textarea>
            </div>
            <button type="submit" id="submitBtn">Book Now</button>
        </form>
    </div>
</div>

<script>
    const scriptURL = 'YOUR_NEW_DEPLOYMENT_URL_HERE'
    const form = document.getElementById('bookingForm')
    const btn = document.getElementById('submitBtn')

    form.addEventListener('submit', e => {
        e.preventDefault()
        btn.disabled = true; btn.innerText = 'Sending...';
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
            .then(res => {
                alert("ബുക്കിംഗ് ഷീറ്റിൽ അപ്‌ഡേറ്റ് ആയിട്ടുണ്ട്!");
                form.reset(); btn.disabled = false; btn.innerText = 'Book Now';
            })
            .catch(err => {
                alert("Error! Please try again.");
                btn.disabled = false; btn.innerText = 'Book Now';
            })
    })
</script>

</body>
</html>
