<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Call Drivers Kochi</title>
    <style>
        /* Modern Premium Dark Theme */
        :root {
            --bg-color: #0b0f19;
            --container-bg: #131c2e;
            --accent-color: #00e5ff;
            --accent-hover: #00b3cc;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --border-color: rgba(0, 229, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
            background: var(--container-bg);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: var(--text-main);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .header h1 span {
            color: var(--accent-color);
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .contact-bar {
            background: rgba(0, 229, 255, 0.1);
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: bold;
            color: var(--accent-color);
        }

        .pricing-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
            font-size: 13px;
            border-left: 4px solid var(--accent-color);
        }

        .pricing-box h3 {
            margin-bottom: 8px;
            color: var(--accent-color);
        }

        .pricing-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            color: var(--text-muted);
        }

        .pricing-grid strong {
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }

        .result-box {
            background: rgba(0, 229, 255, 0.05);
            border: 1px dashed var(--accent-color);
            padding: 20px;
            border-radius: 8px;
            margin-top: 25px;
            display: none;
        }

        .result-box h3 {
            color: var(--accent-color);
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-total {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 10px;
            font-weight: bold;
            font-size: 18px;
            color: var(--accent-color);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent-color);
            border: none;
            border-radius: 8px;
            color: #0b0f19;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 15px;
        }

        .btn:hover {
            background: var(--accent-hover);
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .btn-whatsapp {
            background: #25d366;
            color: white;
            display: none;
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.4);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1>DRIVE<span>CRAFT</span> KOCHI</h1>
        <p>Premium Call Driver Service in Kochi</p>
    </div>

    <div class="contact-bar">
        📞 Hotline: +91 8089003038
    </div>

    <div class="pricing-box">
        <h3>Rate Card</h3>
        <div class="pricing-grid">
            <div>• Local (4h): <strong>₹500</strong> (Extra 1h: ₹100)</div>
            <div>• Outstation (4h): <strong>₹600</strong> (Extra 1h: ₹100)</div>
            <div>• Return Drop Charge: <strong>₹5 / km</strong> (Total KM)</div>
        </div>
    </div>

    <form id="bookingForm" onsubmit="event.preventDefault(); calculateFare();">
        <div class="form-group">
            <label for="name">Customer Name</label>
            <input type="text" id="name" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="phone">Mobile Number</label>
            <input type="tel" id="phone" required placeholder="Enter mobile number">
        </div>

        <div class="form-group">
            <label for="tripType">Trip Type</label>
            <select id="tripType" onchange="toggleDropFields()">
                <option value="local">Kochi Local (4 Hours - ₹500)</option>
                <option value="outstation">Outstation (4 Hours - ₹600)</option>
                <option value="drop">Drop Only (Return Charge - ₹5/km)</option>
            </select>
        </div>

        <div class="form-group" id="hoursGroup">
            <label for="hours">Total Hours Needed</label>
            <input type="number" id="hours" value="4" min="1">
        </div>

        <div class="form-group" id="kmGroup" style="display: none;">
            <label for="km">Total Distance (One Way KM)</label>
            <input type="number" id="km" value="0" min="0" placeholder="Enter total kilometers">
        </div>

        <button type="submit" class="btn">Calculate Fare</button>
    </form>

    <div class="result-box" id="resultBox">
        <h3>Fare Breakdowns</h3>
        <div id="breakdownDetails"></div>
        <div class="result-total" id="totalAmount"></div>
        
        <button class="btn btn-whatsapp" id="whatsappBtn" onclick="sendToWhatsApp()">Book via WhatsApp</button>
    </div>
</div>

<script>
    function toggleDropFields() {
        const tripType = document.getElementById('tripType').value;
        const hoursGroup = document.getElementById('hoursGroup');
        const kmGroup = document.getElementById('kmGroup');

        if (tripType === 'drop') {
            hoursGroup.style.display = 'none';
            kmGroup.style.display = 'block';
        } else {
            hoursGroup.style.display = 'block';
            kmGroup.style.display = 'none';
        }
    }

    let calculatedData = {};

    function calculateFare() {
        const name = document.getElementById('name').value;
        const phone = document.getElementById('phone').value;
        const tripType = document.getElementById('tripType').value;
        const hours = parseInt(document.getElementById('hours').value) || 0;
        const km = parseInt(document.getElementById('km').value) || 0;

        let baseFare = 0;
        let extraHoursFare = 0;
        let returnCharge = 0;
        let totalFare = 0;
        let detailsHtml = '';

        if (tripType === 'local') {
            baseFare = 500;
            if (hours > 4) {
                extraHoursFare = (hours - 4) * 100;
            }
            totalFare = baseFare + extraHoursFare;
            detailsHtml = `
                <div class="result-row"><span>Base Fare (4 Hours):</span><span>₹${baseFare}</span></div>
                <div class="result-row"><span>Extra Hours Charge:</span><span>₹${extraHoursFare}</span></div>
            `;
        } else if (tripType === 'outstation') {
            baseFare = 600;
            if (hours > 4) {
                extraHoursFare = (hours - 4) * 100;
            }
            totalFare = baseFare + extraHoursFare;
            detailsHtml = `
                <div class="result-row"><span>Base Fare (4 Hours Outstation):</span><span>₹${baseFare}</span></div>
                <div class="result-row"><span>Extra Hours Charge:</span><span>₹${extraHoursFare}</span></div>
            `;
        } else if (tripType === 'drop') {
            const totalKM = km * 2; // Return ride calculation as requested (e.g., 5km ride return 5km * 5rs)
            returnCharge = totalKM * 5;
            totalFare = returnCharge;
            detailsHtml = `
                <div class="result-row"><span>One Way Distance:</span><span>${km} KM</span></div>
                <div class="result-row"><span>Total Roundtrip KM:</span><span>${totalKM} KM</span></div>
                <div class="result-row"><span>Return Charge (₹5/KM):</span><span>₹${returnCharge}</span></div>
            `;
        }

        document.getElementById('breakdownDetails').innerHTML = detailsHtml;
        document.getElementById('totalAmount').innerHTML = `<div class="result-row"><span>Estimated Total:</span><span>₹${totalFare}</span></div>`;
        
        document.getElementById('resultBox').style.display = 'block';
        document.getElementById('whatsappBtn').style.display = 'block';

        // Store for WhatsApp message
        calculatedData = {
            name: name,
            phone: phone,
            tripType: tripType.toUpperCase(),
            hours: hours,
            km: km,
            total: totalFare
        };
    }

    function sendToWhatsApp() {
        const myNumber = "918089003038";
        
        let message = `*NEW BOOKING REQUEST*%0A%0A`;
        message += `*Name:* ${calculatedData.name}%0A`;
        message += `*Phone:* ${calculatedData.phone}%0A`;
        message += `*Trip Type:* ${calculatedData.tripType}%0A`;
        if (calculatedData.km > 0) {
            message += `*Distance:* ${calculatedData.km} KM (Roundtrip: ${calculatedData.km * 2} KM)%0A`;
        } else {
            message += `*Duration:* ${calculatedData.hours} Hours%0A`;
        }
        message += `*Estimated Total Fare:* ₹${calculatedData.total}%0A%0A`;
        message += `Please confirm my booking!`;

        window.open(`https://wa.me/${myNumber}?text=${message}`, '_blank');
    }
</script>

</body>
</html>
