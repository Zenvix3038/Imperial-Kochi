<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Zone - Live Driver Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #121212; color: #ffffff; font-family: system-ui, -apple-system, sans-serif; }
        .animate-pulse-slow { animation: pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body class="flex justify-center min-h-screen">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-zinc-900 min-h-screen p-4 flex flex-col justify-between relative shadow-2xl">
        
        <!-- 1. LOGIN SCREEN -->
        <div id="loginScreen" class="flex-grow flex flex-col justify-center items-center px-4">
            <div class="text-center mb-8">
                <i class="fa-solid fa-steering-wheel text-5xl text-yellow-500 mb-2"></i>
                <h1 class="text-2xl font-black tracking-wider text-yellow-500">DRIVE ZONE</h1>
                <p class="text-xs text-zinc-400 mt-1">ഡ്രൈവർ ലോഗിൻ ചെയ്യുക</p>
            </div>
            <div class="w-full bg-zinc-800 p-6 rounded-2xl border border-zinc-700 space-y-4">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-2 font-bold">Driver User ID</label>
                    <input type="text" id="driverIdInput" placeholder="EG: DRV01" class="w-full bg-black/50 border border-zinc-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-yellow-500 text-center font-mono font-bold tracking-widest text-lg">
                </div>
                <button onclick="handleLogin()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-black font-black py-4 rounded-xl text-lg shadow-lg">
                    LOG IN <i class="fa-solid fa-arrow-right-to-bracket ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 2. MAIN APP INTERFACE -->
        <div id="mainApp" class="hidden flex-grow flex flex-col justify-between h-full">
            <header class="flex justify-between items-center border-b border-zinc-800 pb-3">
                <div>
                    <h2 id="welcomeDriver" class="text-lg font-bold text-yellow-500">Driver: -</h2>
                    <p class="text-[10px] text-zinc-500">Status: <span class="text-green-500">Online & Syncing</span></p>
                </div>
                <button onclick="handleLogout()" class="text-xs bg-zinc-800 text-zinc-400 px-3 py-1.5 rounded-lg border border-zinc-700">Logout</button>
            </header>

            <main class="flex-grow flex flex-col justify-center my-4">
                <!-- NO TRIP STATE -->
                <div id="noTripState" class="text-center py-6">
                    <div class="w-16 h-16 bg-zinc-800 rounded-full flex items-center justify-center mx-auto mb-4 border border-zinc-700">
                        <i class="fa-solid fa-radar text-2xl text-yellow-500/50 animate-pulse"></i>
                    </div>
                    <p class="text-zinc-400 text-md">പുതിയ ബുക്കിംഗുകൾക്കായി കാത്തിരിക്കുന്നു...</p>
                    <p class="text-[10px] text-zinc-600 mt-2 uppercase tracking-widest">Checking Google Sheet every 15s</p>
                </div>

                <!-- ACCEPTED STATE -->
                <div id="acceptedState" class="hidden bg-zinc-800/50 p-6 rounded-2xl border border-zinc-800 text-center">
                    <span id="badgeRideType" class="bg-blue-500/10 text-blue-400 text-xs font-bold px-3 py-1 rounded-full uppercase">Booking Accepted</span>
                    <div class="mt-4 mb-6">
                        <h3 id="currentCustName" class="text-2xl font-bold">-</h3>
                        <p id="currentCustRoute" class="text-sm text-zinc-400 mt-1">-</p>
                        <p id="rateSummaryDetails" class="text-xs text-yellow-500/80 mt-3 bg-yellow-500/5 py-2 px-3 rounded-lg border border-yellow-500/10 font-medium text-left">-</p>
                    </div>
                    <button onclick="startTrip()" class="w-full bg-green-600 hover:bg-green-700 text-white font-black py-5 rounded-xl text-xl shadow-lg">START TRIP</button>
                </div>

                <!-- ACTIVE TRIP STATE -->
                <div id="activeTripState" class="hidden bg-zinc-800/50 p-6 rounded-2xl border border-zinc-800 text-center">
                    <div id="liveTimer" class="text-3xl font-mono font-bold text-yellow-400 tracking-wider mb-4">00:00:00</div>
                    <div class="bg-zinc-900/80 p-4 rounded-xl border border-zinc-800 mb-4 text-left">
                        <label class="block text-xs font-bold text-zinc-400 mb-1">Expenses (Toll/Parking)</label>
                        <input type="number" id="tripExpenseInput" placeholder="0" class="w-full bg-black/40 border border-zinc-700 rounded-lg px-3 py-2 text-white">
                    </div>
                    <button onclick="endTrip()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-4 rounded-xl">END TRIP</button>
                </div>

                <!-- FARE SCREEN -->
                <div id="fareScreen" class="hidden bg-zinc-800 p-6 rounded-2xl border-2 border-green-500 text-center">
                    <h2 class="text-xl font-bold text-zinc-300">യാത്ര പൂർത്തിയായി!</h2>
                    <div id="totalFareDisplay" class="text-5xl font-black text-green-400 my-4">₹0</div>
                    <button onclick="closeFareScreen()" class="w-full bg-zinc-700 py-3 rounded-xl">Done</button>
                </div>
            </main>
        </div>

        <!-- NEW BOOKING MODAL -->
        <div id="bookingAlertModal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center p-4 z-50">
            <div class="bg-zinc-800 w-full max-w-sm rounded-2xl p-6 border-2 border-yellow-500 text-center">
                <h2 class="text-xl font-black text-yellow-500">NEW BOOKING!</h2>
                <div class="bg-black/30 p-4 rounded-xl my-4 text-left text-xs space-y-2">
                    <p><strong>Customer:</strong> <span id="popupCustName">-</span></p>
                    <p><strong>Route:</strong> <span id="popupCustRoute">-</span></p>
                    <p><strong>Rate:</strong> <span id="popupRideType" class="text-yellow-400">-</span></p>
                </div>
                <div class="flex gap-3">
                    <button onclick="declineBooking()" class="flex-1 bg-zinc-700 py-3 rounded-xl">Decline</button>
                    <button onclick="acceptBooking()" class="flex-1 bg-green-600 py-3 rounded-xl font-bold">ACCEPT 👍</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL = "https://script.google.com/macros/s/AKfycbzvixEMRAsTvzuX3AcJ0eLAPyTD6lm4DEzwlcez80yN_CwksJnGuZFh7lq3uz3IF3jXrw/exec";
        let currentDriverId = "";
        let lastProcessedBookingId = "";
        let startTime, timerInterval;
        let activeBookingData = {};

        // 1. Login
        function handleLogin() {
            const id = document.getElementById('driverIdInput').value.trim().toUpperCase();
            if (id) {
                currentDriverId = id;
                document.getElementById('welcomeDriver').innerText = `Driver: ${id}`;
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainApp').classList.remove('hidden');
                startSync();
            }
        }

        function handleLogout() { location.reload(); }

        // 2. Google Sheets Sync
        async function startSync() {
            fetchFromSheet();
            setInterval(fetchFromSheet, 15000); // Check every 15 seconds
        }

        async function fetchFromSheet() {
            if (!currentDriverId || !document.getElementById('acceptedState').classList.contains('hidden') || !document.getElementById('activeTripState').classList.contains('hidden')) return;

            try {
                const res = await fetch(SHEET_URL);
                const data = await res.json();
                
                // Find the last row for THIS driver that is "Pending" or "New"
                const relevantBookings = data.filter(b => b["Driver ID"] === currentDriverId);
                if (relevantBookings.length > 0) {
                    const latest = relevantBookings[relevantBookings.length - 1];
                    const bookingId = latest["Booking ID"] || latest["Customer Name"];

                    if (bookingId !== lastProcessedBookingId) {
                        lastProcessedBookingId = bookingId;
                        activeBookingData = {
                            customerName: latest["Customer Name"],
                            route: latest["Route"],
                            rideType: latest["Ride Type"],
                            baseHours: parseInt(latest["Base Hours"] || 4),
                            baseFare: parseInt(latest["Base Fare (₹)"] || 500),
                            extraHourRate: parseInt(latest["Extra Hour Rate (₹)"] || 150)
                        };
                        showPopup();
                    }
                }
            } catch (e) { console.error("Sync Error:", e); }
        }

        function showPopup() {
            document.getElementById('popupCustName').innerText = activeBookingData.customerName;
            document.getElementById('popupCustRoute').innerText = activeBookingData.route;
            document.getElementById('popupRideType').innerText = `${activeBookingData.rideType} (₹${activeBookingData.baseFare}/${activeBookingData.baseHours}h)`;
            document.getElementById('bookingAlertModal').classList.remove('hidden');
        }

        function acceptBooking() {
            document.getElementById('bookingAlertModal').classList.add('hidden');
            document.getElementById('noTripState').classList.add('hidden');
            document.getElementById('currentCustName').innerText = activeBookingData.customerName;
            document.getElementById('currentCustRoute').innerText = activeBookingData.route;
            document.getElementById('rateSummaryDetails').innerHTML = `<b>Package:</b> ₹${activeBookingData.baseFare} for ${activeBookingData.baseHours} hrs. Extra hr: ₹${activeBookingData.extraHourRate}`;
            document.getElementById('acceptedState').classList.remove('hidden');
        }

        function declineBooking() { document.getElementById('bookingAlertModal').classList.add('hidden'); }

        // 3. Trip Logic
        function startTrip() {
            document.getElementById('acceptedState').classList.add('hidden');
            document.getElementById('activeTripState').classList.remove('hidden');
            startTime = new Date();
            timerInterval = setInterval(() => {
                let diff = new Date() - startTime;
                let hrs = Math.floor(diff/3600000).toString().padStart(2,'0');
                let mins = Math.floor((diff%3600000)/60000).toString().padStart(2,'0');
                let secs = Math.floor((diff%60000)/1000).toString().padStart(2,'0');
                document.getElementById('liveTimer').innerText = `${hrs}:${mins}:${secs}`;
            }, 1000);
        }

        function endTrip() {
            clearInterval(timerInterval);
            let durationMins = Math.floor((new Date() - startTime)/60000);
            let extraMins = Math.max(0, durationMins - (activeBookingData.baseHours * 60));
            let extraFare = Math.ceil(extraMins/60) * activeBookingData.extraHourRate;
            let total = activeBookingData.baseFare + extraFare + (parseFloat(document.getElementById('tripExpenseInput').value) || 0);
            
            document.getElementById('totalFareDisplay').innerText = `₹${total}`;
            document.getElementById('activeTripState').classList.add('hidden');
            document.getElementById('fareScreen').classList.remove('hidden');
        }

        function closeFareScreen() { location.reload(); }
    </script>
</body>
</html>
